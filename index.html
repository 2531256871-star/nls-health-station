<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">

  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">

<body data-page="home">
  <header class="site-header">
    <div class="wrap inner">
      <a class="brand" href="index.html">
        <img src="assets/logo.svg" alt="">
        <span data-site-name>NLS频谱健康站</span>

      <nav class="nav" aria-label="主导航">
        <a class="active" href="index.html">首页</a>
        <a class="" href="episodes.html">单集</a>
        <a class="" href="about.html">关于</a>
        <a class="" href="disclaimer.html">免责</a>
        <a href="rss.xml">RSS</a>
        <button class="icon-btn" type="button" data-theme-toggle>深色</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero wrap" id="hero-slot"></section>
    <section class="section wrap">
      <h2>最新一集</h2>
      <div id="latest-slot" class="grid-cards"></div>
    </section>
    <section class="section wrap">
      <h2>全部单集</h2>
      <p class="section-sub">第一季 12 期 · 手机 / 平板 / 电脑均可收听</p>
      <div id="home-grid" class="grid-cards"></div>

  <footer class="site-footer">
    <div class="wrap">
      <div class="links">
        <a href="index.html">首页</a>

  <div class="mini-player" id="mini-player" aria-label="迷你播放器">

      <img data-mp-cover src="assets/logo.svg" alt="">
      <div class="mp-info">
        <div class="mp-title" data-mp-title>未播放</div>

      </div>
      <div class="mp-progress" data-mp-bar role="progressbar" aria-label="播放进度">
        <i data-mp-fill></i>
      </div>
      <div class="mp-time" data-mp-time>00:00 / 00:00</div>
    </div>
  </div>
